<html lang="es">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* ============ Colores (señalización NOM-026-STPS) ============ */
:root{
  color-scheme: light;
  --fondo:#E9ECEF; --superficie:#FFFFFF; --tinta:#1A1D21; --tenue:#5A626B; --linea:#CDD2D8;
  --rojo:#C4161C; --amarillo:#F5B800; --azul:#0057A8; --verde:#00843D;
  --azul-suave:#E3EEF9; --verde-suave:#E2F3EA; --rojo-suave:#FBE6E6; --amarillo-suave:#FFF5D6;
  --sobre-rojo:#FFFFFF; --sobre-amarillo:#1A1D21;
  --etiqueta-fondo:#FFFFFF; --etiqueta-tinta:#000000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --fondo:#14171A; --superficie:#1F2328; --tinta:#ECEEF0; --tenue:#A3ABB4; --linea:#363C43;
    --rojo:#E5484D; --amarillo:#F5C542; --azul:#5B9BE0; --verde:#3DB57A;
    --azul-suave:#1A2A3D; --verde-suave:#16302A; --rojo-suave:#3A1C1E; --amarillo-suave:#3A3115;
    --sobre-rojo:#FFFFFF; --sobre-amarillo:#14171A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#14171A; --superficie:#1F2328; --tinta:#ECEEF0; --tenue:#A3ABB4; --linea:#363C43;
  --rojo:#E5484D; --amarillo:#F5C542; --azul:#5B9BE0; --verde:#3DB57A;
  --azul-suave:#1A2A3D; --verde-suave:#16302A; --rojo-suave:#3A1C1E; --amarillo-suave:#3A3115;
  --sobre-rojo:#FFFFFF; --sobre-amarillo:#14171A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size:17px; line-height:1.5;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--superficie)}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

/* ============ Barra superior ============ */
.barra{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--superficie); border-bottom:1px solid var(--linea);
  display:flex; align-items:center; gap:.75rem; padding:.6rem 1rem;
}
.barra h1{font-size:1rem;margin:0;font-weight:700;flex:1}
.btn{
  border:2px solid var(--tinta); background:var(--superficie); color:var(--tinta);
  border-radius:8px; padding:.45rem .9rem; cursor:pointer; font-weight:700;
}
.btn.primario{background:var(--azul);border-color:var(--azul);color:#fff}
.oculto{display:none!important}

main{max-width:640px;margin:0 auto;padding:1rem}
main.ancho{max-width:960px}

/* ============ Ficha: cabecera tipo etiqueta SGA ============ */
.etiqueta-sga{background:var(--superficie);border:3px solid var(--tinta);border-radius:6px;overflow:hidden}
.palabra{padding:.55rem 1rem;font-size:1.6rem;font-weight:700;letter-spacing:.02em}
.palabra.peligro{background:var(--rojo);color:var(--sobre-rojo)}
.palabra.atencion{background:var(--amarillo);color:var(--sobre-amarillo)}
.identidad{padding:1rem 1rem .5rem}
.identidad h2{font-size:2rem;line-height:1.1;margin:0 0 .25rem}
.identidad p{margin:0;color:var(--tenue)}
.pictos{display:flex;flex-wrap:wrap;gap:1rem;padding:.75rem 1rem 1rem}
.picto{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center;font-size:.8rem;line-height:1.2}
.picto svg{width:72px;height:72px}
.datos{display:grid;grid-template-columns:auto 1fr;gap:.15rem .9rem;padding:0 1rem 1rem;font-size:.92rem}
.datos dt{color:var(--tenue)} .datos dd{margin:0}

/* ============ Secciones ============ */
.seccion{background:var(--superficie);border-radius:6px;margin-top:1rem;padding:1rem;border-left:6px solid var(--linea)}
.seccion h3{margin:0 0 .6rem;font-size:1.15rem}
.seccion ul{margin:0;padding-left:1.2rem} .seccion li{margin:.3rem 0}
.seccion.epp{border-left-color:var(--azul);background:var(--azul-suave)}
.seccion.riesgo{border-left-color:var(--rojo);background:var(--rojo-suave)}
.seccion.derrame{border-left-color:var(--amarillo);background:var(--amarillo-suave)}
.seccion.auxilio{border-left-color:var(--verde);background:var(--verde-suave)}

/* EPP: discos azules como señal de obligación */
.epp-lista{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem}
.epp-lista li{display:flex;gap:.7rem;align-items:flex-start;margin:0!important}
.disco{flex:none;width:46px;height:46px;border-radius:50%;background:var(--azul);display:grid;place-items:center;font-size:1.5rem}
.epp-lista strong{display:block}
.epp-lista span{font-size:.92rem;color:var(--tenue)}

.frases{font-size:.9rem} .frases code{font-family:inherit;font-weight:700;margin-right:.35rem}
.tel{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem}
.tel a{color:var(--tinta);border:2px solid var(--verde);border-radius:8px;padding:.35rem .7rem;text-decoration:none;font-weight:700}
.pie{font-size:.85rem;color:var(--tenue);margin:1.25rem 0 2rem}
.pie a{color:var(--azul)}

/* ============ Catálogo ============ */
.catalogo{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.catalogo button{
  width:100%;text-align:left;cursor:pointer;background:var(--superficie);color:var(--tinta);
  border:1px solid var(--linea);border-radius:6px;padding:.75rem 1rem;
  display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;align-items:center;
}
.catalogo .nombre{font-weight:700;font-size:1.1rem}
.catalogo .meta{color:var(--tenue);font-size:.88rem}
.catalogo .mini{grid-row:1 / span 2;grid-column:2;display:flex;gap:.25rem}
.catalogo .mini svg{width:36px;height:36px}
.intro{color:var(--tenue);margin:0 0 1rem}

/* ============ Generador de etiquetas ============ */
.panel{background:var(--superficie);border-radius:6px;padding:1rem;margin-bottom:1rem}
.panel label{display:block;font-weight:700;margin-bottom:.35rem}
.panel input{width:100%;padding:.55rem .7rem;border:2px solid var(--linea);border-radius:8px;background:var(--fondo);color:var(--tinta)}
.panel .acciones{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.aviso{margin:.6rem 0 0;font-size:.9rem;color:var(--tenue)}
.hoja{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.label-qr{
  background:var(--etiqueta-fondo);color:var(--etiqueta-tinta);
  border:3px solid #000;border-radius:4px;overflow:hidden;break-inside:avoid;
}
.label-qr .palabra{font-size:1.15rem;padding:.3rem .7rem}
.label-qr .cuerpo{display:grid;grid-template-columns:1fr auto;gap:.6rem;padding:.6rem .7rem}
.label-qr h4{margin:0;font-size:1.15rem;line-height:1.15}
.label-qr p{margin:.15rem 0 0;font-size:.8rem}
.label-qr .mini{display:flex;gap:.2rem;margin-top:.4rem}
.label-qr .mini svg{width:40px;height:40px}
.label-qr .qr img,.label-qr .qr canvas{width:118px;height:118px;display:block}
.label-qr .escanea{font-size:.75rem;text-align:center;margin-top:.2rem}

@media print{
  body{background:#fff}
  body::before,.barra,.panel,.no-imprimir{display:none!important}
  main{max-width:none;padding:0}
  .hoja{grid-template-columns:repeat(2,1fr);gap:6mm}
  .palabra.peligro,.palabra.atencion{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  const p = PICTOS[tipo]; if(!p) return "";
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${p.nombre}">
    <polygon points="50,5 95,50 50,95 5,50" fill="#fff" stroke="#E0001B" stroke-width="7" stroke-linejoin="round"/>
    <g fill="#000">${p.glifo}</g></svg>`;
}
const claseAviso = s => s.palabra === "Peligro" ? "peligro" : "atencion";

/* =====================================================================
   4) VISTAS
   ===================================================================== */
const app = document.getElementById("app");
const btnVolver = document.getElementById("btnVolver");
const btnEtiquetas = document.getElementById("btnEtiquetas");
const tituloBarra = document.getElementById("tituloBarra");

function vistaCatalogo(){
  tituloBarra.textContent = "Fichas de sustancias químicas";
  btnVolver.classList.add("oculto"); btnEtiquetas.classList.remove("oculto");
  app.className = "";
  const items = Object.entries(SUSTANCIAS).map(([id, s]) => `
    <li><button type="button" data-id="${id}">
      <span class="nombre">${s.nombre}</span>
      <span class="mini">${s.pictos.map(svgPicto).join("")}</span>
      <span class="meta">${s.codigo} · ${s.palabra} · ${s.area}</span>
    </button></li>`).join("");
  app.innerHTML = `
    <p class="intro">${CONFIG.planta}. Cada envase lleva un QR que abre directamente su ficha.</p>
    <ul class="catalogo">${items}</ul>
    <p class="pie">Borrador con datos de ejemplo. Valida cada ficha contra la HDS del proveedor (NOM-018-STPS-2015) y el EPP contra el análisis de riesgos del puesto (NOM-017-STPS-2008).</p>`;
  app.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => ir(b.dataset.id)));
}

function vistaFicha(id){
  const s = SUSTANCIAS[id];
  tituloBarra.textContent = s.codigo;
  btnVolver.classList.remove("oculto"); btnEtiquetas.classList.add("oculto");
  app.className = "";
  const lista = arr => `<ul>${arr.map(x => `<li>${x}</li>`).join("")}</ul>`;
  app.innerHTML = `
    <article>
      <div class="etiqueta-sga">
        <div class="palabra ${claseAviso(s)}">${s.palabra}</div>
        <div class="identidad">
          <h2>${s.nombre}</h2>
          <p>${s.tipo}</p>
        </div>
        <div class="pictos">${s.pictos.map(t => `<div class="picto">${svgPicto(t)}<span>${PICTOS[t].nombre}</span></div>`).join("")}</div>
        <dl class="datos">
          <dt>Código</dt><dd>${s.codigo}</dd>
          <dt>Área</dt><dd>${s.area}</dd>
          <dt>Presentación</dt><dd>${s.presentacion}</dd>
          <dt>CAS</dt><dd>${s.cas}</dd>
        </dl>
      </div>

      <section class="seccion epp">
        <h3>Equipo de protección obligatorio</h3>
        <ul class="epp-lista">${s.epp.map(e => `
          <li><span class="disco" aria-hidden="true">${e.icono}</span>
          <div><strong>${e.nombre}</strong><span>${e.detalle}</span></div></li>`).join("")}
        </ul>
      </section>

      <section class="seccion riesgo"><h3>Riesgos</h3>${lista(s.riesgos)}</section>
      <section class="seccion"><h3>Para qué se usa</h3><p style="margin:0">${s.uso}</p></section>
      <section class="seccion derrame"><h3>Si hay un derrame</h3>${lista(s.derrame)}</section>
      <section class="seccion auxilio"><h3>Primeros auxilios</h3>${lista(s.auxilios)}
        <div class="tel">${CONFIG.telefonos.map(t => `<a href="tel:${t.numero}">${t.texto}</a>`).join("")}</div>
      </section>
      <section class="seccion"><h3>Almacenamiento e incompatibilidades</h3>${lista(s.almacenamiento)}</section>
      <section class="seccion frases"><h3>Indicaciones de peligro (SGA)</h3>
        ${s.frasesH.map(([c, t]) => `<div><code>${c}</code>${t}</div>`).join("")}
      </section>

      <p class="pie">
        ${s.hds ? `<a href="${s.hds}" target="_blank" rel="noopener">Abrir Hoja de Datos de Seguridad completa</a><br>` : "Hoja de Datos de Seguridad: pendiente de vincular.<br>"}
        Revisión ${s.revision}. Ficha de consulta rápida; no sustituye a la HDS ni a la capacitación.
      </p>
    </article>`;
  window.scrollTo(0, 0);
}

function vistaEtiquetas(){
  tituloBarra.textContent = "Etiquetas QR";
  btnVolver.classList.remove("oculto"); btnEtiquetas.classList.add("oculto");
  app.className = "ancho";
  let base = CONFIG.enlaceBase ||
    (location.protocol.startsWith("http") ? location.origin + location.pathname : "");
  try { base = localStorage.getItem("enlaceBase") || base; } catch(e) {}
  app.innerHTML = `
    <div class="panel">
      <label for="base">Enlace de esta página</label>
      <input id="base" type="url" value="${base}" placeholder="https://...">
      <p class="aviso">Cada QR abrirá este enlace seguido de #id de la sustancia. Si mueves la página a otro sitio (Google Sites, GitHub Pages, intranet), pega aquí el nuevo enlace.</p>
      <div class="acciones">
        <button class="btn primario" id="generar" type="button">Generar etiquetas</button>
        <button class="btn" id="imprimir" type="button">Imprimir</button>
      </div>
    </div>
    <div class="hoja" id="hoja"></div>`;
  document.getElementById("generar").addEventListener("click", generarEtiquetas);
  document.getElementById("imprimir").addEventListener("click", () => { try { window.print(); } catch(e) {} });
  generarEtiquetas();
}

function generarEtiquetas(){
  const base = document.getElementById("base").value.trim().replace(/#.*$/, "");
  try { localStorage.setItem("enlaceBase", base); } catch(e) {}
  const hoja = document.getElementById("hoja");
  if(!base){ hoja.innerHTML = `<p class="aviso">Pega el enlace de esta página para generar los códigos.</p>`; return; }
  hoja.innerHTML = Object.entries(SUSTANCIAS).map(([id, s]) => `
    <div class="label-qr">
      <div class="palabra ${claseAviso(s)}">${s.palabra}</div>
      <div class="cuerpo">
        <div>
          <h4>${s.nombre}</h4>
          <p>${s.codigo} · ${s.area}</p>
          <div class="mini">${s.pictos.map(svgPicto).join("")}</div>
        </div>
        <div><div class="qr" data-url="${base}#${id}"></div><div class="escanea">Escanea antes de usar</div></div>
      </div>
    </div>`).join("");
  hoja.querySelectorAll(".qr").forEach(el => {
    if (typeof QRCode === "undefined"){ el.textContent = "No se cargó la librería QR"; return; }
    new QRCode(el, { text: el.dataset.url, width: 236, height: 236, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  });
}

/* =====================================================================
   5) NAVEGACIÓN: el texto después de # decide qué se muestra
   ===================================================================== */
function ir(token){
  if (SUSTANCIAS[token]) vistaFicha(token);
  else if (token === "etiquetas") vistaEtiquetas();
  else vistaCatalogo();
  try { history.replaceState(null, "", token ? "#" + token : location.pathname); } catch(e) {}
}
btnVolver.addEventListener("click", () => ir(""));
btnEtiquetas.addEventListener("click", () => ir("etiquetas"));
window.addEventListener("hashchange", () => ir(location.hash.slice(1)));
ir(location.hash.slice(1));
</script>
</body>
</html>
